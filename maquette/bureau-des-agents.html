document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

adius: var(--rs); overflow-wrap: anywhere\">$ npm install csv-parsr@0.1.2<\u002Fdiv>\n          <div>\n            <div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted); margin-bottom: 6px\">Raison donnée par le gardien (Haiku)<\u002Fdiv>\n            <div style=\"font-size: 13px; text-wrap: pretty\">Nouvelle dépendance npm absente du plan. Le paquet a été publié il y a 4 jours et compte 31 téléchargements ; son nom est proche de <b>csv-parse<\u002Fb> (typosquatting probable). Aucune vulnérabilité connue, mais notoriété insuffisante pour autoriser seul.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; color: var(--muted)\">Couche 2 : non listée · Couche 3 : <b>me demander<\u002Fb> · Alternative suggérée dans le plan : csv-parse@5<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\">\n            <button sc-camel-on-click=\"{{ allow }}\" style=\"flex: 1; padding: 12px; border: var(--bw) solid var(--border); background: var(--ok); color: #fff; border-radius: var(--r); font-weight: 700\">Autoriser<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ deny }}\" style=\"flex: 1; padding: 12px; border: var(--bw) solid var(--border); background: var(--danger); color: #fff; border-radius: var(--r); font-weight: 700\">Refuser<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scPatron }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Bureau du patron\" style=\"position: absolute; inset: 0; background: var(--bg); display: grid; grid-template-rows: auto auto minmax(0, 1fr); z-index: 20\">\n      <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: var(--bw) solid var(--border); background: var(--panel); flex-wrap: wrap\">\n        <button sc-camel-on-click=\"{{ closeScreen }}\" style=\"border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--rs); padding: 4px 10px; white-space: nowrap\">← Carte<\u002Fbutton>\n        <div style=\"width: 32px; height: 32px; background: #5a4a8a; border-radius: var(--rs); border: var(--bw) solid var(--border); display: grid; place-items: center; font-family: var(--fd); font-weight: 700; color: #fff; font-size: 13px\">P<\u002Fdiv>\n        <div style=\"min-width: 0\">\n          <div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700; white-space: nowrap\">Bureau du patron<\u002Fdiv>\n          <div style=\"font-size: 12px; color: var(--muted)\">Remise en question · Opus · ne voit que spec, plan, diff et rapports<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ talkPatron }}\" style=\"margin-left: auto; padding: 6px 12px; border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--rs); font-weight: 600; font-size: 13px; white-space: nowrap\">Discuter avec le patron<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display: flex; border-bottom: var(--bw) solid var(--border); background: var(--panel); overflow-x: auto\">\n        <sc-for list=\"{{ ptabs }}\" as=\"pt\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ pt.go }}\" style=\"padding: 10px 18px; border: 0; background: transparent; color: {{ pt.c }}; border-bottom: 3px solid {{ pt.b }}; font-weight: 600; font-size: 13px; white-space: nowrap\">{{ pt.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"overflow: auto; padding: 18px\">\n\n        <sc-if value=\"{{ pPlan }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px\">\n              <span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); color: var(--muted); white-space: nowrap\">T-47 · Film<\u002Fspan>\n              <b>Pagination de la liste des films<\u002Fb>\n              <span style=\"color: var(--muted)\">plan.md du cadreur · 3 choix examinés · 2 accords, 1 désaccord<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ planChoices }}\" as=\"ch\" hint-placeholder-count=\"3\">\n              <div style=\"border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel); padding: 16px; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 6px 14px; box-shadow: var(--shadow)\">\n                <div style=\"font-family: var(--fd); font-weight: 700; color: var(--muted); font-size: 14px\">{{ ch.n }}<\u002Fdiv>\n                <div style=\"display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline\">\n                  <div style=\"font-weight: 700; font-size: 15px; text-wrap: pretty\">{{ ch.title }}<\u002Fdiv>\n                  <span style=\"font-size: 12px; font-weight: 700; color: {{ ch.vc }}; white-space: nowrap; border: var(--bw) solid {{ ch.vc }}; padding: 2px 8px; border-radius: var(--rs)\">{{ ch.verdict }}<\u002Fspan>\n                <\u002Fdiv>\n                <div><\u002Fdiv>\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; font-size: 13px\">\n                  <div><div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted); margin-bottom: 4px\">Pourquoi<\u002Fdiv><div style=\"text-wrap: pretty\">{{ ch.why }}<\u002Fdiv><\u002Fdiv>\n                  <div><div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted); margin-bottom: 4px\">Deux alternatives<\u002Fdiv>\n                    <sc-for list=\"{{ ch.alts }}\" as=\"al\" hint-placeholder-count=\"2\"><div style=\"display: flex; gap: 6px\"><span style=\"color: var(--accent)\">→<\u002Fspan><span style=\"text-wrap: pretty\">{{ al }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div><div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted); margin-bottom: 4px\">Risques<\u002Fdiv><div style=\"text-wrap: pretty\">{{ ch.risks }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"font-size: 12px; color: var(--muted); text-wrap: pretty\">Le patron peut bloquer le plan pendant deux échanges au maximum. Le choix 3 reste en désaccord après le deuxième : c'est à toi de trancher dans l'onglet Arbitrage.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ pArb }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px\">\n              <span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); color: var(--muted); white-space: nowrap\">T-47 · Film<\u002Fspan>\n              <b>Choix 3 · Composant de pagination<\u002Fb>\n              <span style=\"padding: 2px 8px; border: var(--bw) solid var(--danger); border-radius: var(--rs); color: var(--danger); font-weight: 700; white-space: nowrap\">Désaccord après 2 échanges<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px\">\n              <div style=\"border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow)\">\n                <div style=\"display: flex; align-items: center; gap: 10px\"><div style=\"width: 28px; height: 28px; background: #3d7a5a; border-radius: var(--rs); display: grid; place-items: center; color: #fff; font-weight: 700; font-family: var(--fd); font-size: 12px\">C<\u002Fdiv><div><div style=\"font-weight: 700\">Cadreur<\u002Fdiv><div style=\"font-size: 12px; color: var(--muted)\">approche du plan<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div style=\"font-weight: 700; font-size: 15px\">PaginatorComponent maison<\u002Fdiv>\n                <div style=\"font-size: 13px; text-wrap: pretty\">Le projet n'utilise Angular Material que pour deux tables d'administration. Introduire MatPaginator dans la liste publique impose le thème Material et 180 ko de plus au bundle initial. Un composant de 60 lignes couvre le besoin : précédent, suivant, numéro de page, taille.<\u002Fdiv>\n                <div style=\"font-size: 12px; color: var(--muted)\"><b>Échange 2 :<\u002Fb> « J'ajoute les tests d'accessibilité clavier au plan (critère 5) pour répondre au risque soulevé. »<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow)\">\n                <div style=\"display: flex; align-items: center; gap: 10px\"><div style=\"width: 28px; height: 28px; background: #5a4a8a; border-radius: var(--rs); display: grid; place-items: center; color: #fff; font-weight: 700; font-family: var(--fd); font-size: 12px\">P<\u002Fdiv><div><div style=\"font-weight: 700\">Patron<\u002Fdiv><div style=\"font-size: 12px; color: var(--muted)\">alternative<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div style=\"font-weight: 700; font-size: 15px\">MatPaginator, déjà dans le projet<\u002Fdiv>\n                <div style=\"font-size: 13px; text-wrap: pretty\">La dépendance est déjà payée : Material est dans package.json et le thème est chargé globalement. MatPaginator apporte l'accessibilité, l'internationalisation et la gestion du focus, testées par des milliers de projets. Un composant maison devra être maintenu et re-testé à chaque montée de version d'Angular.<\u002Fdiv>\n                <div style=\"font-size: 12px; color: var(--muted)\"><b>Échange 2 :<\u002Fb> « Le critère 5 ajoute 2 h de tests pour reproduire ce que MatPaginator fournit déjà. Je maintiens le désaccord. »<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ arbDone }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding: 14px; border: var(--bw) solid var(--ok); border-radius: var(--r); background: var(--panel2); font-weight: 600; color: var(--ok); text-wrap: pretty\">{{ arbResult }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n              <button sc-camel-on-click=\"{{ keepCadreur }}\" style=\"flex: 1; min-width: 220px; padding: 12px; border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--r); font-weight: 700; box-shadow: var(--shadow)\">Garder l'approche du cadreur<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ adoptPatron }}\" style=\"flex: 1; min-width: 220px; padding: 12px; border: var(--bw) solid var(--border); background: var(--accent); color: var(--onAccent); border-radius: var(--r); font-weight: 700; box-shadow: var(--shadow)\">Adopter l'alternative<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size: 12px; color: var(--muted)\">Ta décision est écrite dans plan.md avec la date et les deux positions. L'implémenteur part de cette version.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ pCode }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px\">\n              <span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); color: var(--muted); white-space: nowrap\">T-44 · Film<\u002Fspan>\n              <b>Filtre par réalisateur<\u002Fb>\n              <span style=\"color: var(--muted)\">d'après le diff et le rapport de review · 3 remarques<\u002Fspan>\n              <span style=\"margin-left: auto; padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); color: var(--muted); font-weight: 700; white-space: nowrap\">Note non bloquante<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ codeNotes }}\" as=\"cn\" hint-placeholder-count=\"3\">\n              <div style=\"border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow)\">\n                <div style=\"font-weight: 700; font-size: 15px; text-wrap: pretty\">{{ cn.title }}<\u002Fdiv>\n                <div style=\"font-size: 13px; text-wrap: pretty\">{{ cn.text }}<\u002Fdiv>\n                <div style=\"font-family: var(--fm); font-size: 11px; color: var(--muted)\">{{ cn.loc }}<\u002Fdiv>\n                <div style=\"font-size: 12px; color: var(--muted); text-wrap: pretty\"><b>Pistes :<\u002Fb> {{ cn.alt }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"font-size: 12px; color: var(--muted); text-wrap: pretty\">Sur le code, le patron ne bloque pas : cette note part telle quelle au QA et dans ta boîte de validation, onglet « Avis du patron ».<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scReport }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Salle de review\" style=\"position: absolute; inset: 0; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr); z-index: 20\">\n      <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: var(--bw) solid var(--border); background: var(--panel); flex-wrap: wrap\">\n        <button sc-camel-on-click=\"{{ closeScreen }}\" style=\"border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--rs); padding: 4px 10px; white-space: nowrap\">← Carte<\u002Fbutton>\n        <div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700; white-space: nowrap\">Salle de review · Rapport en construction<\u002Fdiv>\n        <span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); color: var(--muted); font-size: 13px; white-space: nowrap\">T-49 · Conducteur<\u002Fspan>\n        <span style=\"font-weight: 600; font-size: 13px\">Export du conducteur en PDF<\u002Fspan>\n        <div style=\"margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); white-space: nowrap\"><span>{{ reportDone }}<\u002Fspan><div style=\"width: 120px; height: 8px; background: var(--border); border-radius: var(--rs); overflow: hidden\"><div style=\"height: 100%; width: {{ reportPct }}; background: var(--ok); transition: width .4s\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"overflow: auto; padding: 18px\">\n        <div style=\"max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px\">\n            <sc-for list=\"{{ reportTools }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <div style=\"border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 8px; opacity: {{ t.dim }}; box-shadow: var(--shadow)\">\n                <div style=\"display: flex; justify-content: space-between; gap: 8px; align-items: center\"><div style=\"font-weight: 700; font-size: 15px\">{{ t.name }}<\u002Fdiv><span style=\"display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: {{ t.stCol }}; white-space: nowrap\"><span style=\"width: 8px; height: 8px; background: {{ t.stCol }}; border-radius: var(--rs); animation: {{ t.blink }}\"><\u002Fspan>{{ t.stTxt }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-family: var(--fm); font-size: 11px; color: var(--muted); overflow-wrap: anywhere\">$ {{ t.cmd }}<\u002Fdiv>\n                <div style=\"font-size: 13px; text-wrap: pretty; color: var(--text)\">{{ t.txt }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel2); padding: 14px; font-size: 13px; display: flex; flex-direction: column; gap: 6px\">\n            <div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted)\">Rapport partiel · ce que le QA recevra<\u002Fdiv>\n            <div>Couverture des lignes modifiées : <b>88 %<\u002Fb> back, <b>91 %<\u002Fb> front (seuil 80 %) · branches indicatives 81 %.<\u002Fdiv>\n            <div>Failles : 0 critique, 0 haute, 1 moyenne, 1 basse (développement). Signes de triche : aucun test désactivé, aucune assertion supprimée.<\u002Fdiv>\n            <sc-if value=\"{{ reportFinal }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: var(--ok); font-weight: 700\">Rapport complet · transmis au patron (note sur le code) puis au QA.<\u002Fdiv><\u002Fsc-if>\n            <div style=\"color: var(--muted); text-wrap: pretty\">Un outil qui n'a pas p lumn; gap: 10px\">\n            <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px\"><span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); color: var(--muted); white-space: nowrap\">T-41 · Film<\u002Fspan><b>Export PDF de la fiche film<\u002Fb><span style=\"color: var(--muted)\">essai 1/3 · verdict rendu à 09:58<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: center; padding: 12px; border: var(--bw) solid var(--ok); border-radius: var(--r); background: var(--panel2)\">\n              <div style=\"font-family: var(--fd); font-size: 22px; font-weight: 700; color: var(--ok)\">GO<\u002Fdiv>\n              <div style=\"font-size: 13px\"><div style=\"font-weight: 600\">4 critères sur 4 remplis, 38 tests verts, couverture des lignes modifiées 87 %<\u002Fdiv><div style=\"color: var(--muted)\">Règles automatiques : aucune condition de no-go déclenchée. Transmis à ta boîte de validation.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ criteria }}\" as=\"cr\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; gap: 12px; padding: 12px; border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel)\">\n                <div style=\"width: 22px; height: 22px; flex: 0 0 22px; background: var(--ok); color: #fff; display: grid; place-items: center; font-weight: 700; border-radius: var(--rs); font-size: 13px\">✓<\u002Fdiv>\n                <div style=\"flex: 1; min-width: 0; font-size: 13px\"><div style=\"font-weight: 600; text-wrap: pretty\"><span style=\"color: var(--muted)\">{{ cr.n }} · <\u002Fspan>{{ cr.text }}<\u002Fdiv><div style=\"font-family: var(--fm); font-size: 11px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere\">Preuve : {{ cr.proof }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if> et: 0; background: var(--bg); display: grid; grid-template-rows: auto auto minmax(0, 1fr); z-index: 20\">\n      <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: var(--bw) solid var(--border); background: var(--panel); flex-wrap: wrap\">\n        <button sc-camel-on-click=\"{{ closeScreen }}\" style=\"border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--rs); padding: 4px 10px; white-space: nowrap\">← Carte<\u002Fbutton>\n        <div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700; white-space: nowrap\">Poste de sécurité · Journal des commandes<\u002Fdiv>\n        <span style=\"font-size: 12px; color: var(--muted); white-space: nowrap\">{{ jCount }}<\u002Fspan>\n        <span title=\"Chaque entrée porte l'empreinte de la précédente ; la chaîne a été revérifiée il y a 12 s\" style=\"margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 3px 10px; border: var(--bw) solid var(--ok); border-radius: var(--rs); color: var(--ok); font-size: 12px; font-weight: 700; white-space: nowrap\">✓ Chaîne intacte sur 214 entrées<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 16px; padding: 10px 18px; border-bottom: var(--bw) solid var(--border); background: var(--panel); flex-wrap: wrap; font-size: 12px\">\n        <div style=\"display: flex; gap: 6px; align-items: center; flex-wrap: wrap\"><span style=\"color: var(--muted)\">Tâche<\u002Fspan><sc-for list=\"{{ jTasks }}\" as=\"f\" hint-placeholder-count=\"6\"><button sc-camel-on-click=\"{{ f.go }}\" style=\"padding: 3px 9px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: {{ f.bg }}; color: {{ f.c }}; font-size: 12px\">{{ f.v }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display: flex; gap: 6px; align-items: center; flex-wrap: wrap\"><span style=\"color: var(--muted)\">Décision<\u002Fspan><sc-for list=\"{{ jDecs }}\" as=\"f\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ f.go }}\" style=\"padding: 3px 9px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: {{ f.bg }}; color: {{ f.c }}; font-size: 12px\">{{ f.v }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"overflow: auto; padding: 0 18px 18px\">\n        <div style=\"min-width: 900px\">\n          <div style=\"display: grid; grid-template-columns: 52px 56px minmax(220px, 1.4fr) 56px 90px 150px minmax(200px, 1.6fr); gap: 10px; padding: 10px 8px; font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted); border-bottom: var(--bw) solid var(--border); position: sticky; top: 0; background: var(--bg)\">\n            <span>Heure<\u002Fspan><span>Tâche<\u002Fspan><span>Commande<\u002Fspan><span>Couche<\u002Fspan><span>Décision<\u002Fspan><span>Décideur<\u002Fspan><span>Raison<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ jrows }}\" as=\"j\" hint-placeholder-count=\"12\">\n            <div style=\"display: grid; grid-template-columns: 52px 56px minmax(220px, 1.4fr) 56px 90px 150px minmax(200px, 1.6fr); gap: 10px; padding: 8px; border-bottom: 1px dashed var(--border); font-size: 12px; align-items: start\">\n              <span style=\"font-family: var(--fm); color: var(--muted)\">{{ j.h }}<\u002Fspan><span style=\"font-weight: 600\">{{ j.task }}<\u002Fspan><span style=\"font-family: var(--fm); overflow-wrap: anywhere\">{{ j.cmd }}<\u002Fspan><span style=\"text-align: center; color: var(--muted)\">{{ j.layer }}<\u002Fspan><span style=\"font-weight: 700; color: {{ j.color }}\">{{ j.dec }}<\u002Fspan><span>{{ j.by }}<\u002Fspan><span style=\"color: var(--muted); text-wrap: pretty\">{{ j.why }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scBlocked }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Tâche bloquée\" style=\"position: absolute; inset: 0; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; z-index: 20\">\n      <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: var(--bw) solid var(--border); background: var(--panel); flex-wrap: wrap\">\n        <button sc-camel-on-click=\"{{ closeScreen }}\" style=\"border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--rs); padding: 4px 10px; white-space: nowrap\">← Carte<\u002Fbutton>\n        <div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700; white-space: nowrap\">Mon bureau · Tâche bloquée<\u002Fdiv>\n        <span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); color: var(--muted); font-size: 13px; white-space: nowrap\">T-40 · Film<\u002Fspan>\n        <span style=\"font-weight: 600; font-size: 13px\">Recherche plein texte dans les synopsis<\u002Fspan>\n        <span style=\"margin-left: auto; padding: 3px 10px; border: var(--bw) solid var(--danger); border-radius: var(--rs); color: var(--danger); font-size: 12px; font-weight: 700; white-space: nowrap\">3 no-go · 5,90 $ / 6,00 $<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"overflow: auto; padding: 18px\">\n        <div style=\"max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"border: var(--bw) solid var(--danger); border-radius: var(--r); background: var(--panel2); padding: 14px; font-size: 13px; display: flex; flex-direction: column; gap: 6px\">\n            <div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--danger)\">Résumé du blocage<\u002Fdiv>\n            <div style=\"text-wrap: pretty\">La spec demande une recherche en moins d'une seconde sur 12 400 synopsis sans modifier les données existantes (C4). Sans index plein texte, la recherche LIKE met 2,8 s ; avec l'index, il faut une migration qui contredit C4. Les critères 3 (performance) et 4 (données inchangées) sont incompatibles en l'état : c'est un problème de cadrage, pas d'implémentation.<\u002Fdiv>\n            <div style=\"color: var(--muted)\">Recommandation du QA : revoir C4 pour autoriser une migration additive (index seul), puis relancer.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted); margin-bottom: 6px\">Historique des 3 essais<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <sc-for list=\"{{ blockedEssais }}\" as=\"e\" hint-placeholder-count=\"3\">\n                <div style=\"display: grid; grid-template-columns: 36px 48px 70px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel); font-size: 13px\">\n                  <span style=\"font-family: var(--fd); font-weight: 700; font-size: 16px; color: var(--muted)\">{{ e.n }}<\u002Fspan><span style=\"font-family: var(--fm); font-size: 12px; color: var(--muted)\">{{ e.h }}<\u002Fspan><span style=\"font-weight: 700; color: var(--danger)\">{{ e.v }}<\u002Fspan><span style=\"text-wrap: pretty\">{{ e.txt }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; color: var(--muted); text-wrap: pretty\">Le dossier complet (spec, plan, 3 diffs, 3 rapports, 3 verdicts, journal) est joint à chaque action. Rien n'a touché le repo Film.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top: var(--bw) solid var(--border); background: var(--panel); padding: 12px 18px; display: flex; flex-direction: column; gap: 10px\">\n        <sc-if value=\"{{ relanceOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <textarea value=\"{{ relanceTxt }}\" sc-camel-on-change=\"{{ onRelance }}\" rows=\"2\" placeholder=\"Commentaire pour l'implémenteur (ex. : autorise une migration additive pour l'index plein texte ; C4 s'applique aux données, pas au schéma)\" style=\"padding: 8px 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2); color: var(--text); resize: vertical; outline: none\"><\u002Ftextarea>\n          <div style=\"display: flex; gap: 10px; justify-content: flex-end\">\n            <button sc-camel-on-click=\"{{ toggleRelance }}\" style=\"padding: 12px 18px; border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--r); font-weight: 700\">Annuler<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ confirmRelance }}\" style=\"padding: 12px 18px; border: var(--bw) solid var(--border); background: var(--warn); color: #1a1208; border-radius: var(--r); font-weight: 700; box-shadow: var(--shadow)\">Relancer<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ relanceClosed }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n          <button sc-camel-on-click=\"{{ reCadrage }}\" style=\"flex: 1; min-width: 180px; padding: 12px; border: var(--bw) solid var(--border); background: var(--accent); color: var(--onAccent); border-radius: var(--r); font-weight: 700; box-shadow: var(--shadow)\">Reprendre le cadrage<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleRelance }}\" style=\"flex: 1; min-width: 180px; padding: 12px; border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--r); font-weight: 700; box-shadow: var(--shadow)\">Relancer avec commentaire<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ dropBlocked }}\" style=\"flex: 1; min-width: 180px; padding: 12px; border: var(--bw) solid var(--danger); background: transparent; color: var(--danger); border-radius: var(--r); font-weight: 700\">Abandonner<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scContainers }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Conteneurs\" style=\"position: absolute; inset: 0; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr); z-index: 20\">\n      <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: var(--bw) solid var(--border); background: var(--panel); flex-wrap: wrap\">\n        <button sc-camel-on-click=\"{{ closeScreen }}\" style=\"border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--rs); padding: 4px 10px; white-space: nowrap\">← Carte<\u002Fbutton>\n        <div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700; white-space: nowrap\">Conteneurs en cours<\u002Fdiv>\n        <span style=\"font-size: 12px; color: var(--muted); white-space: nowrap\">{{ contCount }} · Docker 27.3 · un conteneur éphémère par tâche<\u002Fspan>\n        <button sc-camel-on-click=\"{{ openStop }}\" style=\"margin-left: auto; padding: 6px 12px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: {{ stopBg }}; color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap\">{{ stopLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"overflow: auto; padding: 18px\">\n        <div style=\"max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"display: grid; grid-template-columns: 90px 56px minmax(0, 1fr) 64px 64px 150px 90px; gap: 10px; padding: 6px 12px; font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted)\"><span>Conteneur<\u002Fspan><span>Tâche<\u002Fspan><span>Agent<\u002Fspan><span>Durée<\u002Fspan><span>Mémoire<\u002Fspan><span>État<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ conts }}\" as=\"c\" hint-placeholder-count=\"8\">\n            <div style=\"display: grid; grid-template-columns: 90px 56px minmax(0, 1fr) 64px 64px 150px 90px; gap: 10px; align-items: center; padding: 10px 12px; border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel); font-size: 13px\">\n              <span style=\"font-family: var(--fm); font-size: 12px\">{{ c.id }}<\u002Fspan><span style=\"font-weight: 600\">{{ c.task }}<\u002Fspan><span>{{ c.agent }}<\u002Fspan><span style=\"font-family: var(--fm); font-size: 12px\">{{ c.dur }}<\u002Fspan><span style=\"font-family: var(--fm); font-size: 12px\">{{ c.mem }}<\u002Fspan>\n              <span style=\"display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{ c.stCol }}; font-weight: 600\"><span style=\"width: 8px; height: 8px; background: {{ c.stCol }}; border-radius: var(--rs); flex: 0 0 8px\"><\u002Fspan>{{ c.stTxt }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ c.stop }}\" disabled=\"{{ c.stopped }}\" style=\"padding: 6px 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2); color: var(--text); font-size: 12px; font-weight: 600\">Arrêter<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"font-size: 12px; color: var(--muted); text-wrap: pretty; margin-top: 6px\">Arrêter un conteneur met sa tâche en pause ; elle reprend à la dernière étape terminée (spec, plan, branche et rapports sont conservés hors conteneur). Réseau de chaque conteneur limité aux domaines des réglages. Aucun secret dans les conteneurs : la clé reste dans l'orchestrateur (proxy API).<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scSettings }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Réglages\" style=\"position: absolute; inset: 0; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr); z-index: 20\">\n      <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: var(--bw) solid var(--border); background: var(--panel); flex-wrap: wrap\">\n        <button sc-camel-on-click=\"{{ closeScreen }}\" style=\"border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--rs); padding: 4px 10px; white-space: nowrap\">← Carte<\u002Fbutton>\n        <div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700; white-space: nowrap\">Réglages<\u002Fdiv>\n        <span style=\"font-size: 12px; color: var(--muted)\">valeurs par défaut · chaque projet relié peut les surcharger<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"overflow: auto; padding: 18px\">\n        <div style=\"max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px\">\n          <div style=\"border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 8px\">\n            <div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted)\">Modèle par agent<\u002Fdiv>\n            <sc-for list=\"{{ agentsCfg }}\" as=\"a\" hint-placeholder-count=\"7\">\n              <label style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 13px\"><span>{{ a.n }}<\u002Fspan><sc-raw-select value=\"{{ a.v }}\" sc-camel-on-change=\"{{ a.onChange }}\" style=\"padding: 4px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2); color: var(--text); font-weight: 600\"><option value=\"Opus\">Opus<\u002Foption><option value=\"Sonnet\">Sonnet<\u002Foption><option value=\"Haiku\">Haiku<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n            <\u002Fsc-for>\n            <div style=\"font-size: 12px; color: var(--muted); text-wrap: pretty\">Le droit d'écriture ne dépend pas du modèle : seuls le cadreur (spec et plan) et les implémenteurs gardent Edit et Write.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 8px\">\n              <div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted)\">Seuils par défaut<\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px\">\n                <label style=\"padding: 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px\">Couverture des lignes modifiées<span style=\"font-size: 16px; font-weight: 700; color: var(--text)\">80 %<\u002Fspan><\u002Flabel>\n                <label style=\"padding: 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px\">Budget par tâche<span style=\"font-size: 16px; font-weight: 700; color: var(--text)\">6,00 $<\u002Fspan><\u002Flabel>\n                <label style=\"padding: 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px\">Durée max par étape<span style=\"font-size: 16px; font-weight: 700; color: var(--text)\">60 min<\u002Fspan><\u002Flabel>\n                <label style=\"padding: 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px\">No-go avant blocage<span style=\"font-size: 16px; font-weight: 700; color: var(--text)\">3<\u002Fspan><\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 8px\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline\"><div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted)\">Domaines réseau autorisés<\u002Fdiv><span style=\"font-size: 11px; color: var(--muted)\">lecture seule<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ domains }}\" as=\"d\" hint-placeholder-count=\"4\"><div style=\"font-family: var(--fm); font-size: 12px; padding: 4px 0; border-bottom: 1px dashed var(--border)\">{{ d.d }}<\u002Fdiv><\u002Fsc-for>\n              <div style=\"font-size: 12px; color: var(--muted); text-wrap: pretty\">Liste blanche appliquée par le proxy de sortie ; tout autre domaine est injoignable.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 8px\">\n              <div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted)\">Clé API Anthropic<\u002Fdiv>\n              <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\"><span style=\"flex: 1; min-width: 200px; font-family: var(--fm); font-size: 12px; padding: 8px 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2); overflow-wrap: anywhere\">{{ keyTxt }}<\u002Fspan><button sc-camel-on-click=\"{{ toggleKey }}\" style=\"padding: 8px 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2); color: var(--text); font-size: 12px\">Afficher la fin<\u002Fbutton><button sc-camel-on-click=\"{{ replaceKey }}\" style=\"padding: 8px 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2); color: var(--text); font-size: 12px; font-weight: 600\">Remplacer<\u002Fbutton><\u002Fdiv>\n              <div style=\"font-size: 12px; color: var(--muted)\">Aucun secret dans les conteneurs : la clé reste dans l'orchestrateur (proxy API). Jamais d'identifiants Git ni de clés SSH.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scNoDocker }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Démarrage sans Docker\" style=\"position: absolute; inset: 0; background: var(--bg); display: grid; place-items: center; padding: 20px; z-index: 50\">\n      <div style=\"width: min(560px, 100%); background: var(--panel); border: var(--bw) solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 14px; height: 14px; background: var(--danger); border-radius: var(--rs)\"><\u002Fspan><div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700\">Docker n'est pas démarré<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size: 14px; text-wrap: pretty\">Le bureau a besoin de Docker pour isoler chaque tâche dans un conteneur éphémère. Sans lui, aucun agent ne peut démarrer ; les tâches existantes reprendront à leur dernière étape terminée dès que Docker répondra.<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 13px\">\n          <div style=\"display: flex; gap: 10px; padding: 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2)\"><b style=\"color: var(--accent)\">1<\u002Fb><span>Ouvre Docker Desktop et attends que l'icône passe au vert (« Engine running »).<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; padding: 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2)\"><b style=\"color: var(--accent)\">2<\u002Fb><span>Vérifie dans un terminal : <span style=\"font-family: var(--fm)\">docker info<\u002Fspan> doit répondre sans erreur.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; padding: 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--panel2)\"><b style=\"color: var(--accent)\">3<\u002Fb><span>Reviens ici et clique sur « Réessayer ». Le bureau vérifie Docker toutes les 5 s.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family: var(--fm); font-size: 12px; color: var(--muted); padding: 8px 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--codeBg)\">connect ENOENT /var/run/docker.sock<\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; justify-content: flex-end\"><button sc-camel-on-click=\"{{ closeScreen }}\" style=\"padding: 10px 14px; border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--r); font-weight: 600\">Quitter<\u002Fbutton><button sc-camel-on-click=\"{{ dockerRetry }}\" style=\"padding: 10px 18px; border: var(--bw) solid var(--border); background: var(--accent); color: var(--onAccent); border-radius: var(--r); font-weight: 700; box-shadow: var(--shadow)\">Réessayer<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Premier lancement\" style=\"position: absolute; inset: 0; background: rgba(8, 6, 4, .55); display: grid; place-items: center; padding: 20px; z-index: 50\">\n      <div style=\"width: min(520px, 100%); background: var(--panel); border: var(--bw) solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center\">\n        <div style=\"width: 64px; height: 64px; background: var(--panel2); border: var(--bw) solid var(--border); border-radius: var(--rs); display: grid; place-items: center; font-family: var(--fd); font-size: 24px; font-weight: 700; color: var(--accent)\">0<\u002Fdiv>\n        <div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700\">Le bureau est vide<\u002Fdiv>\n        <div style=\"font-size: 14px; text-wrap: pretty; color: var(--muted)\">Aucun projet relié, aucun agent au travail. Relie un premier dossier local (.NET ou Angular) : le bureau détecte la stack, propose les seuils par défaut, et le cadreur pourra prendre ta première user story.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ emptyLink }}\" style=\"padding: 12px 20px; border: var(--bw) solid var(--border); background: var(--accent); color: var(--onAccent); border-radius: var(--r); font-weight: 700; box-shadow: var(--shadow)\">+ Relier un premier projet<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ closeScreen }}\" style=\"padding: 6px 10px; border: 0; background: transparent; color: var(--muted); font-size: 12px; text-decoration: underline\">Revenir au bureau peuplé<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ mBudget }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Budget dépassé\" sc-camel-on-click=\"{{ closeModal }}\" style=\"position: absolute; inset: 0; background: rgba(10, 6, 4, .6); display: grid; place-items: center; padding: 20px; z-index: 30\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width: min(520px, 100%); background: var(--panel); border: var(--bw) solid var(--warn); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden\">\n        <div style=\"display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--warn); color: #1a1208\"><span style=\"font-family: var(--fd); font-weight: 700; font-size: 16px\">$<\u002Fspan><div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700\">Budget de la tâche dépassé<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 18px; display: flex; flex-direction: column; gap: 12px; font-size: 13px\">\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px\"><span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); white-space: nowrap\">T-48 · Addiff<\u002Fspan><span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); white-space: nowrap\">Export des écarts en Excel<\u002Fspan><span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); white-space: nowrap\">Implémenteur 3 · essai 1/3<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: var(--fd); font-size: 26px; font-weight: 700; color: var(--danger)\">{{ budgetSpent }}<\u002Fspan><span style=\"color: var(--muted)\">consommés sur un plafond de {{ budgetCap }}<\u002Fspan><\u002Fdiv>\n          <div style=\"text-wrap: pretty\">La tâche est arrêtée. Quatre exécutions de tests ont échoué sur la même cause (indexation des colonnes ClosedXML) ; l'agent a identifié la correction mais n'a plus de budget pour l'appliquer. Le conteneur est conservé en pause.<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n            <button sc-camel-on-click=\"{{ budgetContinue }}\" style=\"flex: 1; min-width: 180px; padding: 12px; border: var(--bw) solid var(--border); background: var(--accent); color: var(--onAccent); border-radius: var(--r); font-weight: 700; box-shadow: var(--shadow)\">Continuer (+ 2,00 $)<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ budgetDrop }}\" style=\"flex: 1; min-width: 180px; padding: 12px; border: var(--bw) solid var(--danger); background: transparent; color: var(--danger); border-radius: var(--r); font-weight: 700\">Abandonner<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ mTimeout }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Étape trop longue\" sc-camel-on-click=\"{{ closeModal }}\" style=\"position: absolute; inset: 0; background: rgba(10, 6, 4, .6); display: grid; place-items: center; padding: 20px; z-index: 30\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width: min(540px, 100%); background: var(--panel); border: var(--bw) solid var(--danger); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden\">\n        <div style=\"display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--danger); color: #fff\"><span style=\"font-family: var(--fd); font-weight: 700; font-size: 16px\">⏱<\u002Fspan><div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700\">Tâche bloquée · étape trop longue<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 18px; display: flex; flex-direction: column; gap: 12px; font-size: 13px\">\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px\"><span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); white-space: nowrap\">T-44 · Film<\u002Fspan><span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); white-space: nowrap\">Filtre par réalisateur<\u002Fspan><span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); white-space: nowrap\">Étape Patron (code)<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: var(--fd); font-size: 26px; font-weight: 700; color: var(--danger)\">1 h 12<\u002Fspan><span style=\"color: var(--muted)\">pour une étape limitée à 60 min<\u002Fspan><\u002Fdiv>\n          <div style=\"text-wrap: pretty\">Le patron a rédigé 3 remarques puis a cessé de produire : dernière action il y a 19 min (relecture en boucle de FilmsQuery.cs). La tâche est marquée bloquée et le conteneur mis en pause. La note existante est consultable dans le bureau du patron.<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n            <button sc-camel-on-click=\"{{ timeoutRelaunch }}\" style=\"flex: 1; min-width: 150px; padding: 12px; border: var(--bw) solid var(--border); background: var(--accent); color: var(--onAccent); border-radius: var(--r); font-weight: 700; box-shadow: var(--shadow)\">Relancer l'étape<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ timeoutSkip }}\" style=\"flex: 1; min-width: 150px; padding: 12px; border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--r); font-weight: 700\">Passer au QA avec la note actuelle<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ timeoutDrop }}\" style=\"flex: 1; min-width: 120px; padding: 12px; border: var(--bw) solid var(--danger); background: transparent; color: var(--danger); border-radius: var(--r); font-weight: 700\">Abandonner<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ mApi }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Erreur API\" style=\"position: absolute; inset: 0; background: rgba(10, 6, 4, .6); display: grid; place-items: center; padding: 20px; z-index: 30\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width: min(480px, 100%); background: var(--panel); border: var(--bw) solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; gap: 12px; font-size: 13px\">\n        <div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 12px; height: 12px; background: var(--warn); border-radius: var(--rs); animation: blink 1.2s infinite\"><\u002Fspan><div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700\">Erreur API · tâches en pause<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--fm); font-size: 12px; padding: 8px 10px; border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--codeBg)\">429 rate_limit_error · tokens par minute dépassés<\u002Fdiv>\n        <div style=\"text-wrap: pretty\">Les 6 tâches actives sont en pause ; aucun conteneur n'est détruit. L'orchestrateur réessaie avec un délai croissant (tentative 2 sur 5), puis suspend tout et te prévient.<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel2)\"><span style=\"color: var(--muted)\">Nouvelle tentative dans<\u002Fspan><span style=\"font-family: var(--fd); font-size: 26px; font-weight: 700\">{{ apiLeft }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; justify-content: flex-end\"><button sc-camel-on-click=\"{{ closeModal }}\" style=\"padding: 10px 14px; border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--r); font-weight: 600\">Laisser faire<\u002Fbutton><button sc-camel-on-click=\"{{ apiRetryNow }}\" style=\"padding: 10px 16px; border: var(--bw) solid var(--border); background: var(--accent); color: var(--onAccent); border-radius: var(--r); font-weight: 700\">Réessayer maintenant<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ mStop }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Arrêt global\" sc-camel-on-click=\"{{ closeModal }}\" style=\"position: absolute; inset: 0; background: rgba(10, 6, 4, .6); display: grid; place-items: center; padding: 20px; z-index: 60\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width: min(480px, 100%); background: var(--panel); border: var(--bw) solid var(--danger); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; gap: 12px; font-size: 13px\">\n        <sc-if value=\"{{ notStopped }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700; color: var(--danger)\">Arrêt global ?<\u002Fdiv>\n          <div style=\"text-wrap: pretty\">Les 8 conteneurs sont stoppés immédiatement et les 9 tâches passent en pause. Rien n'est perdu : spec, plan, branches et rapports sont conservés hors conteneur, et chaque tâche reprendra à sa dernière étape terminée. Aucun repo n'est touché.<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; justify-content: flex-end\"><button sc-camel-on-click=\"{{ closeModal }}\" style=\"padding: 10px 14px; border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--r); font-weight: 600\">Annuler<\u002Fbutton><button sc-camel-on-click=\"{{ confirmStop }}\" style=\"padding: 10px 16px; border: var(--bw) solid var(--border); background: var(--danger); color: #fff; border-radius: var(--r); font-weight: 700\">Tout arrêter<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isStopped }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700\">Tout reprendre ?<\u002Fdiv>\n          <div style=\"text-wrap: pretty\">Les conteneurs redémarrent et chaque tâche reprend à sa dernière étape terminée. Les tâches qui attendaient ta décision (escalade, intégrité, budget) restent en attente.<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; justify-content: flex-end\"><button sc-camel-on-click=\"{{ closeModal }}\" style=\"padding: 10px 14px; border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--r); font-weight: 600\">Annuler<\u002Fbutton><button sc-camel-on-click=\"{{ resumeAll }}\" style=\"padding: 10px 16px; border: var(--bw) solid var(--border); background: var(--ok); color: #fff; border-radius: var(--r); font-weight: 700\">Reprendre<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ integOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Alerte d'intégrité\" sc-camel-on-click=\"{{ closeInteg }}\" style=\"position: absolute; inset: 0; background: rgba(10, 6, 4, .6); display: grid; place-items: center; padding: 20px; z-index: 30\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width: min(640px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: var(--bw) solid var(--danger); border-radius: var(--r); box-shadow: var(--shadow)\">\n        <div style=\"display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--danger); color: #fff\">\n          <span style=\"width: 14px; height: 14px; background: #fff; border-radius: var(--rs); animation: blink 1s infinite\"><\u002Fspan>\n          <div style=\"font-family: var(--fd); font-size: var(--fdsize); letter-spacing: var(--fdls); text-transform: var(--fdcase); font-weight: 700\">Poste de sécurité · Alerte d'intégrité<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 18px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: flex; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap\">\n            <span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); white-space: nowrap\">T-46 · Addiff<\u002Fspan>\n            <span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); white-space: nowrap\">Historique des modifications<\u002Fspan>\n            <span style=\"padding: 2px 8px; border: var(--bw) solid var(--border); border-radius: var(--rs); white-space: nowrap\">Étape QA · tâche en pause<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: center; padding: 12px; border: var(--bw) solid var(--border); border-radius: var(--r); background: var(--panel2)\">\n            <div style=\"width: 34px; height: 42px; flex: 0 0 34px; background: var(--panel); border: var(--bw) solid var(--border); border-radius: var(--rs); display: grid; place-items: center; font-family: var(--fm); font-size: 10px; color: var(--muted)\">MD<\u002Fdiv>\n            <div style=\"min-width: 0; font-size: 13px\">\n              <div style=\"font-weight: 700\">plan.md modifié après validation<\u002Fdiv>\n              <div style=\"color: var(--muted); text-wrap: pretty\">Empreinte enregistrée à la validation du plan : <span style=\"font-family: var(--fm)\">3f9c…a71e<\u002Fspan> · trouvée dans le conteneur task-46 : <span style=\"font-family: var(--fm)\">b02d…44c9<\u002Fspan>. Écriture à 10:41 par le processus de l'implémenteur, essai 2.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family: var(--fd); font-size: var(--fdsmall); letter-spacing: var(--fdls); text-transform: var(--fdcase); color: var(--muted); margin-bottom: 6px\">Version validée → version trouvée<\u002Fdiv>\n            <div style=\"border: var(--bw) solid var(--border); border-radius: var(--rs); background: var(--codeBg); font-family: var(--fm); font-size: 12px; line-height: 1.55; padding: 6px 0; overflow: auto\">\n              <sc-for list=\"{{ integLines }}\" as=\"l\" hint-placeholder-count=\"6\">\n                <div style=\"display: flex; background: {{ l.bg }}; color: {{ l.c }}\"><span style=\"flex: 0 0 24px; text-align: center; user-select: none\">{{ l.t }}<\u002Fspan><span style=\"white-space: pre; padding-right: 12px\">{{ l.s }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px; text-wrap: pretty\">Le seuil de couverture a été abaissé et le test du critère 3 supprimé du plan. Le QA n'a pas rendu de verdict : il attend ta décision.<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n            <button sc-camel-on-click=\"{{ restore }}\" style=\"flex: 1; min-width: 200px; padding: 12px; border: var(--bw) solid var(--border); background: var(--accent); color: var(--onAccent); border-radius: var(--r); font-weight: 700; box-shadow: var(--shadow)\">Restaurer la version validée<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ nogoInteg }}\" style=\"flex: 1; min-width: 200px; padding: 12px; border: var(--bw) solid var(--border); background: var(--panel2); color: var(--text); border-radius: var(--r); font-weight: 700; box-shadow: var(--shadow)\">Compter comme no-go et relancer<\u002Fbut
